  #     MB_DB_DBNAME: *metabase_db
  #     MB_DB_HOST: postgres
  #     MB_DB_POST: 5432
volumes:
  db_data_hydra:
  ganache-data:
networks:
  my-proxy-net:
    name: local_test_network
